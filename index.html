<title>World Cup 2026 Knockout Stage</title>
<style>
  :root{
    --bg:#0a0a0c; --panel:#5be7e0; --panel-text:#06121a;
    --win:#26d07c; --win-text:#04140c; --empty:#1c1d22; --empty-line:#2b2d34;
    --line:#3a6f6c; --text:#f2f4f5; --muted:#8c9196;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);background-color:var(--bg);background-image:url('wp16410977-world-cup-2026-desktop-wallpapers.webp');background-size:cover;background-position:center;background-repeat:no-repeat;color:var(--text);overflow:hidden;
    font-family:"Arial Narrow",Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,.45);pointer-events:none;z-index:-1;}
  .header{display:none;}
  /* scaler: measures available width and shrinks the bracket to fit */
  .scroll{padding:14px 10px 14px;overflow:hidden;min-height:calc(100vh - 30px);}
  .scaler{margin:0 auto;overflow:hidden;}
  .bracket{display:flex;align-items:stretch;justify-content:center;width:1804px;padding:0 8px;
    transform-origin:top left;}
  /* on phones, stack the two halves so text stays legible */
  @media (max-width:760px){
    .scroll{overflow-x:hidden;display:block;}
    .bracket{flex-direction:column;width:auto;max-width:420px;margin:0 auto;transform:none!important;}
    .bracket .round{min-width:0;width:100%;}
    .bracket .round.final{order:99;}
    .match{margin:8px 0;}
    .name{font-size:14px;}
  }
  .round{display:flex;flex-direction:column;justify-content:space-around;flex:1;min-width:185px;}
  .round.final{justify-content:center;min-width:200px;}
  .match{display:flex;flex-direction:column;gap:6px;margin:8px 8px;position:relative;}
  .match.has-highlights{cursor:pointer;z-index:1;}
  .match.has-highlights:hover::after{content:"Click for highlights";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:6px 10px;border-radius:999px;font-size:11px;letter-spacing:.4px;white-space:nowrap;pointer-events:none;z-index:20;}
  .match.has-highlights:hover .team{transform:translateY(-1px);}
  .team{display:flex;align-items:center;gap:9px;background:var(--panel);color:var(--panel-text);
    border:none;border-radius:22px;padding:9px 13px;min-height:44px;width:100%;text-align:left;
    font-family:inherit;transition:background .15s,opacity .15s,transform .15s;
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 0 22px rgba(91,231,224,.10);}
  .team.clickable{cursor:pointer;}
  .team.empty{background:var(--empty);color:var(--muted);cursor:default;}
  .team.winner{background:var(--win);color:var(--win-text);font-weight:700;}
  .team.loser{opacity:.45;}
  .team.clickable:not(.empty):hover{filter:brightness(.98);transform:translateY(-1px);}
  .flag{width:30px;height:20px;border-radius:3px;flex:0 0 auto;overflow:hidden;display:block;
    box-shadow:0 0 0 1px rgba(0,0,0,.15);}
  .flag svg{width:100%;height:100%;display:block;}
  .name{flex:1;font-weight:700;font-size:13px;letter-spacing:.3px;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .score{flex:0 0 auto;min-width:24px;text-align:center;font-weight:800;font-size:14px;
    background:rgba(0,0,0,.2);border-radius:8px;padding:2px 8px;}
  .ptag{flex:0 0 auto;font-size:10px;font-weight:800;letter-spacing:.5px;
    background:rgba(0,0,0,.28);color:inherit;border-radius:6px;padding:2px 5px;}
  .team.empty .score{visibility:hidden;}
  .champ{display:none;}
  .champ .label{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;}
  .champ .winnerName{font-size:18px;font-weight:900;text-transform:uppercase;margin-top:4px;
    color:var(--win);min-height:22px;}
  .hint{text-align:center;color:var(--muted);font-size:12px;padding:6px 16px 6px;}
</style>
</head>

// ====== TEAMS (Round of 32 seeding from the bracket image) ======
var R32 = [
  ["Germany","de"],["Paraguay","py"],["France","fr"],["Sweden","se"],

var LEFT=R32.slice(0,16), RIGHT=R32.slice(16,32);
var MID=0;
function makeMatch(a,b,side){return {id:"m"+(MID++),a:a||null,b:b||null,sa:null,sb:null,winner:null,pens:false,side:side,advancesTo:null};}
function buildHalf(teams,side){
  var rounds=[], prev=[];
  for(var i=0;i<teams.length;i+=2) prev.push(makeMatch(teams[i],teams[i+1],side));
  rounds.push(prev);
  while(prev.length>1){
    var next=[];
    for(var j=0;j<prev.length;j+=2){
      var m=makeMatch(null,null,side);
      prev[j].advancesTo=[m,0]; prev[j+1].advancesTo=[m,1];
      next.push(m);
    }
    rounds.push(next); prev=next;
  }
  return rounds;
}
var leftRounds=buildHalf(LEFT,"left"), rightRounds=buildHalf(RIGHT,"right");
var FINAL=makeMatch(null,null,"final");
leftRounds[leftRounds.length-1][0].advancesTo=[FINAL,0];
rightRounds[rightRounds.length-1][0].advancesTo=[FINAL,1];

var ALL=[]; leftRounds.forEach(function(r){r.forEach(function(m){ALL.push(m);});});
ALL.push(FINAL); rightRounds.forEach(function(r){r.forEach(function(m){ALL.push(m);});});
var byId={}; ALL.forEach(function(m){byId[m.id]=m;});

// ====== STATE ======
var bracket=document.getElementById("bracket");

function teamHTML(team,score,state,pens){
  if(!team) return '<div class="team empty"><span class="flag"></span><span class="name">TBD</span><span class="score"></span></div>';
  var sc = (score===null||score===undefined)?"":score;
  var cls="team "+state;
  var pTag = pens ? '<span class="ptag">P</span>' : '';
  return '<div class="'+cls+'">'+flagBox(team.code)+'<span class="name">'+team.name+'</span>'+pTag+'<span class="score">'+sc+'</span></div>';
}
function matchHTML(m){
  var stA="",stB="",pA=false,pB=false;
  if(m.winner==="a"){stA="winner";stB="loser";pA=m.pens;}
  else if(m.winner==="b"){stB="winner";stA="loser";pB=m.pens;}
  var hasHighlights = HIGHLIGHT_LINKS[m.id] ? ' has-highlights' : '';
  var urlAttr = HIGHLIGHT_LINKS[m.id] ? ' data-url="'+HIGHLIGHT_LINKS[m.id]+'"' : '';
  return '<div class="match'+hasHighlights+'" data-match="'+m.id+'"'+urlAttr+'>'+teamHTML(m.a,m.sa,stA,pA)+teamHTML(m.b,m.sb,stB,pB)+'</div>';
}
function roundColumn(matches){
  var col=document.createElement("div"); col.className="round";
  matches.forEach(function(m){col.insertAdjacentHTML("beforeend",matchHTML(m));});
  return col;
}
function render(){
  bracket.innerHTML="";
  leftRounds.forEach(function(r){bracket.appendChild(roundColumn(r));});
  var fcol=document.createElement("div"); fcol.className="round final";
  fcol.insertAdjacentHTML("beforeend",matchHTML(FINAL)); bracket.appendChild(fcol);
  rightRounds.slice().reverse().forEach(function(r){bracket.appendChild(roundColumn(r));});
  var champ=document.getElementById("champName");
  if(champ){
    if(FINAL.winner){var w=FINAL.winner==="a"?FINAL.a:FINAL.b; champ.textContent=w?w.name:"TBD";}
    else champ.textContent="TBD";
  }
  attach();
  fitBracket();
}

// scale the bracket down so it always fits the page width (desktop/tablet)
function fitBracket(){
  var scaler=document.getElementById("scaler");
  var scroll=scaler.parentElement;
  if(window.innerWidth<=760){ // mobile uses stacked layout, no scaling
    bracket.style.transform=""; scaler.style.height=""; scaler.style.width="";
    return;
  }
  // measure true content extent at full size, including any pill overflow
  bracket.style.transform="none";
  scaler.style.width=""; scaler.style.height="";
  var bb=bracket.getBoundingClientRect();
  var minL=bb.left, maxR=bb.right, maxB=bb.bottom, minT=bb.top;
  var teams=bracket.querySelectorAll(".team");
  for(var i=0;i<teams.length;i++){
    var r=teams[i].getBoundingClientRect();
    if(r.left<minL)minL=r.left; if(r.right>maxR)maxR=r.right;
    if(r.bottom>maxB)maxB=r.bottom; if(r.top<minT)minT=r.top;
  }
  var naturalWidth=(maxR-minL)+4;
  var naturalHeight=(maxB-minT)+4;
  var availWidth=scroll.clientWidth - 16;
  var availHeight=Math.max(220, window.innerHeight - 80);
  var scale=Math.min(1, availWidth/naturalWidth, availHeight/naturalHeight);
  bracket.style.transform="scale("+scale+")";
  scaler.style.width=(naturalWidth*scale)+"px";
  scaler.style.height=(naturalHeight*scale)+"px";
}
window.addEventListener("resize", fitBracket);

// ====== INTERACTION ======
function attach(){
  var nodes=document.querySelectorAll(".match");
  nodes.forEach(function(el){
    el.onclick=function(){
      var url = el.getAttribute("data-url");
      if(url){ window.open(url, "_blank"); }
    };
  });
}

function setWinner(m,side){
  var newWinner=side==="a"?m.a:m.b;
  if(m.winner && m.winner!==side) propagateClear(m);
  m.winner=side;
  if(m.advancesTo){
    var next=m.advancesTo[0], slot=m.advancesTo[1];
    var prev=slot===0?next.a:next.b;
    if(prev && prev!==newWinner){resetResult(next);propagateClear(next);}
    if(slot===0) next.a=newWinner; else next.b=newWinner;
  }
}
function resetResult(m){m.sa=null;m.sb=null;m.winner=null;m.pens=false;}
function clearMatch(m){propagateClear(m);resetResult(m);}
function propagateClear(m){
  if(!m.advancesTo) return;
  var next=m.advancesTo[0], slot=m.advancesTo[1];
  if(slot===0) next.a=null; else next.b=null;
  resetResult(next); propagateClear(next);
}

// ====== DEFAULT RESULTS ======
var COMPLETED_RESULTS = {
  m0: {sa: 1, sb: 1, winner: "b", pens: true},
  m2: {sa: 0, sb: 1, winner: "b", pens: false},
  m3: {sa: 1, sb: 1, winner: "b", pens: true},
  m15: {sa: 2, sb: 1, winner: "a", pens: false}
};
function applyCompletedMatches(){
  Object.keys(COMPLETED_RESULTS).forEach(function(id){
    var m = byId[id], res = COMPLETED_RESULTS[id];
    if(!m || !res) return;
    m.sa = res.sa;
    m.sb = res.sb;
    m.pens = !!res.pens;
    setWinner(m, res.winner);
  });
}

applyCompletedMatches();
render();
</script>
</body>
